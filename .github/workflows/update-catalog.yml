
name: Actualizar catalogo AceStream

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Buscar eventos AceStream
        run: |
          python scraper.py --base-url https://livetv.sx --output catalog.json --max-events 100

      - name: Validar catalogo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("catalog.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, list):
              raise SystemExit("Catalogo invalido")

          print("Eventos disponibles:", len(data))
          PY

      - name: Publicar actualizacion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar eventos AceStream"
            git push
          else
            echo "Sin cambios en el catalogo"
          fi
