name: Actualizar catalogo AceStream
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: actualizar-catalogo
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4
      - name: Actualizar catalogo
        run: python scraper.py --base-url https://livetv.sx --output catalog.json --max-events 100
      - name: Validar archivo
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          p = Path('catalog.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if not isinstance(data, list): raise SystemExit('Formato invalido')
          print('Eventos:', len(data))
          PY2
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar catalogo AceStream"
            git push
          fi
